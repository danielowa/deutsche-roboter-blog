baseURL: https://blog.deutsche-roboter.de/
languageCode: de
defaultContentLanguage: de
title: Deutsche Roboter Blog
theme: PaperMod
pagination:
  pagerSize: 10

buildDrafts: false
buildFuture: false
buildExpired: false

minify:
  disableXML: true
  minifyOutput: true

params:
  env: production
  title: Deutsche Roboter Blog
  description: "Tägliche Einblicke in die Welt der Robotik – Forschung, Industrie und Zukunftstechnologien"
  keywords:
    - Robotik
    - Roboter
    - Künstliche Intelligenz
    - Automatisierung
    - Technik
    - Deutschland
  author: Deutsche Roboter Blog
  defaultTheme: auto
  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowWordCount: false
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true
  disableSpecial1stPost: false
  disableScrollToTop: false
  hidemeta: false
  hideSummary: false
  showtoc: true
  tocopen: false

  assets:
    favicon: "/favicon.ico"
    disableFingerprinting: true

  label:
    text: "Deutsche Roboter Blog"
    icon: "/favicon.ico"
    iconHeight: 35

  homeInfoParams:
    Title: "Willkommen beim Deutschen Roboter Blog"
    Content: >
      Tägliche Deep-Dive-Artikel über die neuesten Entwicklungen in der Robotik.
      Von humanoiden Robotern über industrielle Automatisierung bis hin zu KI-gesteuerten Systemen –
      hier erfahren Sie alles über die Zukunft der Robotik.

  socialIcons:
    - name: rss
      url: "/index.xml"

  cover:
    hidden: false
    hiddenInList: false
    hiddenInSingle: false

  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys:
      - title
      - permalink
      - summary
      - content

menu:
  main:
    - identifier: archiv
      name: Archiv
      url: /archives/
      weight: 10
    - identifier: suche
      name: Suche
      url: /search/
      weight: 20
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON

markup:
  goldmark:
    renderer:
      unsafe: false
  highlight:
    noClasses: false
